# Empty workspace table: pins this crate as its own workspace root so Cargo
# doesn't walk up into the frust repo's root workspace (this app lives at
# `apps/muxr-app`, nested inside the frust checkout) — same shape as
# `examples/huddle/Cargo.toml`'s `[workspace]` table.
[workspace]

[package]
name = "muxr"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` is the shared library Android's `System.loadLibrary` loads (the JNI
# bridge); `staticlib` is the archive the iOS Xcode target links (the C-ABI
# `frust_*` bridge); `rlib` keeps the crate usable as a normal Rust
# library for the desktop `main.rs` preview binary.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# NOTE: temporary path dependency pointing at the Frust repo checkout
# that generated this project ("frust_path" is explicitly a temporary
# mechanism). Once Frust crates are published, `frust
# create` will emit a version dependency here instead.
#
# Design system (gs1): Glyph is this app's design system, named explicitly
# below (`"glyph"` + `"glyph-fonts"`) instead of left to `frust`'s own
# crate-level defaults — mirrors the default `Cargo.toml.tmpl`'s comment (see
# that file for the full rationale). `src/lib.rs`'s
# `frust::app!(..., setup = { frust::glyph_theme::install(); })` is the
# runtime call that actually makes it the active theme; delete
# `"glyph"`/`"glyph-fonts"` below and that call to opt out (still builds,
# neutral-themed), or swap them for `"material"`/`"cupertino"` plus the
# matching `frust::set_default_theme(...)` call to use one of the other two
# built-in design systems instead.
frust = { path = "../../crates/frust", default-features = false, features = ["glyph", "glyph-fonts"] }

# `--arch clean-signals` demo: the Frust
# bridge for `clean-signals` (component-scoped controller lifecycle,
# `async_view`, etc.) — an in-repo plugin, added like any other Frust
# plugin (`frust_path` resolves to `crates/frust`, so
# `../../plugins/clean-signals-frust` walks back up to the repo root and
# down into the plugin's own directory — mirrors `frust-shared-preferences`'s
# dependency line in the default `Cargo.toml.tmpl`).
clean-signals-frust = { path = "../../plugins/clean-signals-frust" }

# `clean-signals` itself is not yet published (see `docs/DEVELOPMENT.md`'s
# Version-Pin Policy), so it is **git+rev-pinned to the public repo** — the
# exact same spec `clean-signals-frust`'s own `clean-signals` dependency uses,
# so Cargo unifies both into one crate identity. That identity rule is
# load-bearing, not cosmetic: two sources for `clean-signals` give
# `ControllerCore`/`Failure` two distinct types and `use_controller` stops
# accepting this app's controllers (the exact error a mismatch produces). The
# framework moved all four of its own consumers off the `../clean-signals-rs`
# sibling-checkout path onto this pin (frust `4a6a484`); this app is the fifth
# consumer and follows it. Bump the rev here and in the plugin together, never
# one alone — `examples/huddle/Cargo.toml` documents the rule at length.
clean-signals = { git = "https://github.com/f0x-it-llc/clean-signals-rs", rev = "910f626" }

# `log` facade dependency for the release-only `lean` feature below — mirrors
# the default `Cargo.toml.tmpl`'s block verbatim (the `frust` CLI passes
# `--features lean` for every `--release` build regardless of scaffold arch, so
# this variant must declare the feature too or a release build fails on an
# unknown feature). See `Cargo.toml.tmpl` for the full release-lean rationale.
log = "0.4"

# Login-token hygiene (review F5, app-side half): `ConnectController::token`
# wraps its `String` in `zeroize::Zeroizing` so the buffer is scrubbed on
# every drop/overwrite rather than left as stale plaintext in a freed
# allocation, on top of the explicit clear-on-connect/clear-on-disconnect
# calls that own the *when* — see that controller's module docs. Default
# features (`alloc`) are all this needs; already a transitive dependency
# elsewhere in the wider Frust workspace lock, so this pin adds no new
# supply-chain surface.
zeroize = "1"

# Test-harness-only, NOT an escape hatch: the headless screen tests
# (`tests/*.rs`) drive Frust's `RenderRoot` directly (`tests/support/mod.rs` —
# the desktop shell's own rebuild/layout/paint seam, no GPU, no window) and
# pump the reactive runtime's UI-thread local task queue frame by frame.
# `RenderRoot` is deliberately not in `frust::authoring` (it is shell-owned,
# not something an app constructs), so the harness still names these crates
# the long way; production code names none of `frust-core`/`frust-scene`/
# `frust-text`/`kurbo`/`peniko` (mirrors `examples/huddle`'s own dev-deps
# comment verbatim — see that file for the full rationale). `tokio` is kept
# available for `#[tokio::test]`-style controller/use-case unit tests once
# Phase 2 adds them; this crate's own production code never spawns a tokio
# runtime itself.
[dev-dependencies]
frust-core = { path = "../../crates/frust-core" }
frust-reactive = { path = "../../crates/frust-reactive" }
frust-scene = { path = "../../crates/frust-scene" }
frust-text = { path = "../../crates/frust-text" }
kurbo = "0.13.1"
peniko = "0.6.1"
reactive_graph = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[features]
# Release-lean log ceiling (release-only opt-in — see `Cargo.toml.tmpl`).
lean = ["log/release_max_level_warn"]

# `--release` mode: fully optimized, stripped, single-panic-path binary for
# store distribution. Mirrors the default template's
# `Cargo.toml.tmpl` block verbatim (not covered by the `profile_sync`
# tripwire test, which only compares the root/default-template/huddle
# manifests, but kept in sync by hand for a consistent scaffold).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `--profile` mode: release performance with symbols + tracing kept for
# on-device performance measurement. Artifacts land in
# `target/<triple>/profile/` (custom-profile name, verified legal).
[profile.profile]
inherits = "release"
debug = true
strip = "none"

# `[profile.dev]` per-package overrides for the render/shader-compile stack:
# vello/wgpu/naga's shader-pipeline
# translation runs at `opt-level = 0` by default, which is slow enough on a
# physical iOS device that the OS SIGKILLs a debug `frust run` before the
# synchronous, main-thread launch-time shader compile finishes.
[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dep opt widening: non-workspace-member dependencies
# build at `opt-level = 1` in debug; this app's own code stays at the fast
# default dev opt-level, and the named shader-stack overrides above
# (opt-level 2) still win over this wildcard since a named package override
# takes precedence over `"*"`.
[profile.dev.package."*"]
opt-level = 1