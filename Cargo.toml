
[workspace]

[package]
name = "muxr"
version = "0.1.0"
edition = "2024"
publish = false


[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
frust = { path = "../../frust/crates/frust", default-features = false }
frust-glyph = { path = "../../frust/plugins/glyph" }
clean-signals-frust = { path = "../../frust/plugins/clean-signals-frust" }
frust-clipboard = { path = "../../frust/plugins/clipboard" }
frust-haptics = { path = "../../frust/plugins/haptics" }
clean-signals = { git = "https://github.com/f0x-it-llc/clean-signals-rs", rev = "910f626" }

log = "0.4"
zeroize = "1"
vt100 = "=0.16.2"
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "tls-aws-lc",
] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", default-features = false, features = ["sync"] }
tokio-stream = "0.1"
rustls = "0.23"
rustls-platform-verifier = "0.7"
webpki-roots = "1"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
arc-swap = "1"
frust-plugin = { path = "../../frust/crates/frust-plugin" }
frust-shared-preferences = { path = "../../frust/plugins/shared-preferences" }
frust-secure-storage = { path = "../../frust/plugins/secure-storage" }
frust-camera = { path = "../../frust/plugins/camera" }
frust-iap = { path = "../../frust/plugins/iap" }
frust-url-launcher = { path = "../../frust/plugins/url-launcher" }
# `frust-iap` models the per-platform `requestPurchase` payloads as raw
# `serde_json::Value` by design, so a caller has to build them itself.
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
] }
frust-paths = { path = "../../frust/crates/frust-paths" }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"


[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
frust-core = { path = "../../frust/crates/frust-core", features = ["test-support"] }
frust-reactive = { path = "../../frust/crates/frust-reactive" }
frust-scene = { path = "../../frust/crates/frust-scene" }
frust-shell-common = { path = "../../frust/crates/frust-shell-common" }
frust-text = { path = "../../frust/crates/frust-text" }
kurbo = "0.13.1"
peniko = "0.6.1"
reactive_graph = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }


tonic = { version = "0.14", default-features = false, features = [
    "router",
    "server",
    "transport",
] }
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }

[features]
lean = ["log/release_max_level_warn"]
# Desktop preview of the purchase flow: `cargo run --features mock-iap` keeps
# `pro::di` on the scripted in-memory entitlement store, since no desktop
# platform can sell. Never passed by a device build — the CLI only ever selects
# `lean` (release) or `frust/perf-trace` (debug/profile).
mock-iap = []


[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"


[profile.profile]
inherits = "release"
debug = true
strip = "none"

[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_shaders]
opt-level = 2

[profile.dev.package.vello_encoding]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

# Debug dep opt widening: non-workspace-member dependencies
# build at `opt-level = 1` in debug; this app's own code stays at the fast
# default dev opt-level, and the named shader-stack overrides above
# (opt-level 2) still win over this wildcard since a named package override
# takes precedence over `"*"`.
[profile.dev.package."*"]
opt-level = 1
