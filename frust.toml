[app]
name = "muxr"
org = "com.it.f0x"
description = "Muxr — attach to and control remote terminal sessions"

# Deep-link scheme registered in the generated Android manifest / iOS
# Info.plist. Informational here — Frust tooling doesn't parse
# this section; it documents what `frust create --deeplink-scheme` baked
# into the platform templates. Editing it does NOT re-render the manifest/
# Info.plist — re-run `frust create --overwrite` (or edit the platform
# files directly) to change it after scaffolding.
[deeplink]
scheme = "muxr"

# [flavors]
# dev = { app-id-suffix = ".dev" }
# prod = {}

# Android release signing is driven by `android/app/keystores/key.properties`,
# a Java properties file the Gradle build reads directly (this file is NOT
# parsed by Frust). It must be gitignored (the generated .gitignore already
# excludes `key.properties` and `*.jks`) so the keystore/passwords never enter
# version control. Keys (develop.*/prod.* prefixes):
#   develop.storePassword=<...>   prod.storePassword=<...>
#   develop.keyPassword=<...>     prod.keyPassword=<...>
#   develop.keyAlias=<...>        prod.keyAlias=<...>
#   develop.storeFile=<path to .jks>   prod.storeFile=<path to .jks>
# Generate an upload keystore with:
#   keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA \
#     -storetype JKS -keysize 2048 -validity 10000 -alias upload
# Without key.properties, release builds fall back to debug signing (a loud
# Gradle warning is logged for every release-artifact task Gradle exposes for
# the variant — assemble/bundle/package<Flavor>Release, see
# android/app/build.gradle.kts).
# CLI-gate caveat: `frust build --release` instead gates on `android/key.properties`
# (a different path this Gradle rig never reads) — do NOT create it to appease
# the CLI; Gradle ignores it and ships a silently debug-signed release (see
# docs/DEVELOPMENT.md's Android Signing section).
# [signing]
# keystore = "android/app/keystores/key.properties"

# Override the derived iOS bundle identifier (defaults to
# `org.camelCase(name)`, e.g. `com.it.f0x.muxr`).
# identifier = "com.it.f0x.muxr"

# `team` is the Apple Developer Team ID (ByneApp, LLC) — read by
# `frust-drive`'s `ios_build::team` module (precedence: `FRUST_IOS_TEAM` env
# → this `[ios] team` → auto-detected `DEVELOPMENT_TEAM`) to codesign a
# device `frust build ios`/`frust run -d <iphone>`.
[ios]
team = "87MFQ5L648"