[app]
name = "muxr"
org = "com.it.f0x"
description = "Muxr — attach to and control remote terminal sessions"

# Deep-link scheme registered in the generated Android manifest / iOS
# Info.plist. Informational here — Frust tooling doesn't parse
# this section; it documents what `frust create --deeplink-scheme` baked
# into the platform templates. Editing it does NOT re-render the manifest/
# Info.plist — re-run `frust create --overwrite` (or edit the platform
# files directly) to change it after scaffolding.
[deeplink]
scheme = "muxr"

# [flavors]
# dev = { app-id-suffix = ".dev" }
# prod = {}

# Android release signing is driven by `android/app/keystores/key.properties`,
# a Java properties file the Gradle build reads directly. It must be
# gitignored (the generated .gitignore already excludes `key.properties` and
# `*.jks`) so the keystore/passwords never enter version control. Keys
# (develop.*/prod.* prefixes):
#   develop.storePassword=<...>   prod.storePassword=<...>
#   develop.keyPassword=<...>     prod.keyPassword=<...>
#   develop.keyAlias=<...>        prod.keyAlias=<...>
#   develop.storeFile=<path to .jks>   prod.storeFile=<path to .jks>
# Generate an upload keystore with:
#   keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA \
#     -storetype JKS -keysize 2048 -validity 10000 -alias upload
# Without key.properties, release builds fall back to debug signing (a loud
# Gradle warning is logged for every release-artifact task Gradle exposes for
# the variant — assemble/bundle/package<Flavor>Release, see
# android/app/build.gradle.kts).
#
# `[signing]` below points the `frust` CLI's own release-signing gate
# (`frust-drive`'s `android_build::signing`, verified against
# crates/frust-drive/src/manifest.rs's `SigningSection` and
# crates/frust-drive/src/android_build/signing.rs's key-resolution format
# string) at this same file/prefix, so `frust build --release`/`appbundle`
# resolves the identical `prod.*` keys Gradle already reads above instead of
# the scaffold default `android/key.properties`. Gradle itself is untouched —
# it keeps reading `app/keystores/key.properties` directly; the CLI's
# generated `android/.frust-signing.properties` is transient — owner-only,
# deleted by the CLI on exit, and gitignored as a backstop —
# and this app's `build.gradle.kts` does not read it. `prefix` is single-valued
# (one flavor per manifest), so it only wires up the `production` flavor's
# `prod.*` keys — a develop RELEASE build still goes through the direct
# Gradle recipe, `cd android && ./gradlew :app:assembleDevelopRelease`.
[signing]
key-properties = "app/keystores/key.properties"
prefix = "prod"
# The CI half: the env-var *names* Gradle's `signingValue()` falls back to for
# the `prod.*` keys (android/app/build.gradle.kts, android/app/keystores/README.md),
# so the CLI gate resolves the same variables as Gradle rather than
# frust-drive's ANDROID_STORE_FILE/… defaults — one rig, one set of names.
env = { store-file = "KEYSTORE_PATH", store-password = "STORE_PASSWORD", key-alias = "KEY_ALIAS", key-password = "KEY_PASSWORD" }
# Override the derived iOS bundle identifier (defaults to
# `org.camelCase(name)`, e.g. `com.it.f0x.muxr`).
# identifier = "com.it.f0x.muxr"

# `team` is the Apple Developer Team ID (ByneApp, LLC) — read by
# `frust-drive`'s `ios_build::team` module (precedence: `FRUST_IOS_TEAM` env
# → this `[ios] team` → auto-detected `DEVELOPMENT_TEAM`) to codesign a
# device `frust build ios`/`frust run -d <iphone>`.
[ios]
team = "87MFQ5L648"