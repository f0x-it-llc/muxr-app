org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Path to the sibling frust checkout's Android embedding module (`settings.gradle.kts`
# includes it as `:frust-embedding`). One line to edit when moving the project
# to another machine — Cargo.toml's path deps carry the same `../../frust` derivation.
# Becomes a published Maven coordinate post-crates.io.
frust.embedding.dir=../../../frust/platform/android/frust-embedding